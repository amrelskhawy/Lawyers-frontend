<section class="login-container">
  <div class="side-panel">
    <div class="logo-wrapper">
      <img src="/assets/Img/logo.svg" alt="Law Firm Logo" width="200" height="auto" />
    </div>
  </div>

  <div class="login-form-wrapper">
    <div class="login-card">
      <div class="brand-header">
        <div class="home-nav">
          <a routerLink="/" class="btn-home" [attr.aria-label]="'return_main' | translate" [title]="'return_main' | translate">
            <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
          </a>
          <app-translation></app-translation>
        </div>
        <img src="/assets/Img/logo.svg" alt="Law Firm Logo" class="app-logo" width="200" height="auto" />
        <h1>{{ "Welcome_back" | translate }}</h1>
        <p class="subtitle">{{ "please_login" | translate }}</p>
      </div>

      <form [formGroup]="Form()" (ngSubmit)="onSubmit()" class="modern-form" novalidate>
        <!-- Email -->
        <div class="form-group">
          <label for="email">{{ "email" | translate }}</label>
          <div class="input-container"
            [class.error]="getControlName('email')?.invalid && getControlName('email')?.touched">
            <span class="icon" aria-hidden="true"><i class="fa-solid fa-envelope"></i></span>
            <input pInputText id="email" type="email" formControlName="email" autocomplete="email"
              class="bare-input" placeholder="{{ 'email' | translate }}"
              [attr.aria-invalid]="getControlName('email')?.invalid && getControlName('email')?.touched"
              [attr.aria-describedby]="
                getControlName('email')?.invalid && getControlName('email')?.touched ? 'email-error' : null
              " />
          </div>
          <div id="email-error" class="error-msg" role="alert" aria-live="polite"
            *ngIf="getControlName('email')?.invalid && getControlName('email')?.touched">
            <small *ngIf="getControlName('email')?.errors?.['required']">{{ "filed_reqierd" | translate }}</small>
            <small *ngIf="getControlName('email')?.errors?.['email']">{{ "vaild_email" | translate }}</small>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">{{ "password" | translate }}</label>
          <div class="input-container"
            [class.error]="getControlName('password')?.invalid && getControlName('password')?.touched">
            <span class="icon" aria-hidden="true"><i class="fa-solid fa-lock"></i></span>
            <p-password inputId="password" formControlName="password" [feedback]="false" [toggleMask]="true"
              autocomplete="current-password" placeholder="{{ 'password' | translate }}"
              styleClass="bare-password" inputStyleClass="bare-input"
              [attr.aria-invalid]="getControlName('password')?.invalid && getControlName('password')?.touched"
              [attr.aria-describedby]="
                getControlName('password')?.invalid && getControlName('password')?.touched ? 'password-error' : null
              " />
          </div>
          <div id="password-error" class="error-msg" role="alert" aria-live="polite"
            *ngIf="getControlName('password')?.invalid && getControlName('password')?.touched">
            <small>{{ "filed_reqierd" | translate }}</small>
          </div>
        </div>

        <div class="form-actions">
          <div class="remember-me">
            <p-checkbox inputId="rememberMe" formControlName="rememberMe" [binary]="true" />
            <label for="rememberMe">{{ "remember_me" | translate }}</label>
          </div>
          <a routerLink="/auth/forgot-password" class="forgot-password">{{ "reset_password" | translate }}</a>
        </div>

        <button pButton type="submit" class="btn-primary" [attr.aria-label]="'LOGIN' | translate">
          <span>{{ "LOGIN" | translate }}</span>
          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </button>
      </form>
    </div>
  </div>
</section>
