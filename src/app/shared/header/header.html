<section class="section-header">
  <div class="content-header container">
    <div class="logo-wrapper">
      <img src="assets/Img/LOGO-GOLD.svg" alt="{{ 'BRAND_NAME' | translate }}" class="logo-header" />
    </div>

    <nav class="header-links" [attr.aria-label]="'NAV_HOME' | translate">
      <ul>
        <li>
          <a class="nav-link" [routerLink]="['/']" (click)="onClickListActive('Home')">
            {{ 'NAV_HOME' | translate }}
          </a>
        </li>
        <li>
          <button class="nav-link" type="button" (click)="onClickListActive('About')">
            {{ 'NAV_ABOUT' | translate }}
          </button>
        </li>
        <li>
          <button class="nav-link" type="button" (click)="onClickListActive('Services')">
            {{ 'NAV_SERVICES' | translate }}
          </button>
        </li>
        <li>
          <button class="nav-link" type="button" (click)="onClickListActive('teamWork')">
            {{ 'teamWork' | translate }}
          </button>
        </li>
        <li>
          <a class="nav-link" [routerLink]="['/booking']">
            {{ 'Book_with_us' | translate }}
          </a>
        </li>
      </ul>
    </nav>

    <div class="btn-header-div">
      <button *ngIf="pwa.installable()" type="button" class="btn-header-install"
        (click)="pwa.install()" [disabled]="pwa.installing()"
        [attr.aria-label]="'pwa_install_title' | translate">
        <i class="fa-solid" [ngClass]="pwa.installing() ? 'fa-spinner fa-spin' : 'fa-download'" aria-hidden="true"></i>
        <span>{{ 'pwa_install_button' | translate }}</span>
      </button>

      <button type="button" [routerLink]="['/auth/login']" class="btn-header">
        {{ 'LOGIN' | translate }}
      </button>

      <app-translation></app-translation>
    </div>
  </div>
</section>
