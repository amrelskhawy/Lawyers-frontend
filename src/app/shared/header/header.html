<section class="section-header">
  <div class="content-header container">
    <div class="logo-wrapper">
      <img src="assets/Img/LOGO-GOLD.svg" alt="Logo" class="logo-header" />
    </div>

    <div class="header-links">
      <ul>
        <li [routerLink]="['/']" (click)="onClickListActive('Home')">
          <a>{{ 'NAV_HOME' | translate }}</a>
        </li>
        <li (click)="onClickListActive('About')">
          <a>{{ 'NAV_ABOUT' | translate }}</a>
        </li>
        <!-- <li (click)="onClickListActive('HowWork')">
          <a>{{ 'NAV_HOW_IT_WORKS' | translate }}</a>
        </li> -->
        <li (click)="onClickListActive('Services')">
          <a>{{ 'NAV_SERVICES' | translate }}</a>
        </li>

        <li (click)="onClickListActive('teamWork')">
          <a>{{ 'teamWork' | translate }}</a>
        </li>

        <li [routerLink]="['/booking']">
          <a>{{ 'Book_with_us' | translate }}</a>
        </li>
      </ul>
    </div>

    <div class="btn-header-div">
      <button *ngIf="pwa.installable()" type="button" class="btn-header-install"
        (click)="pwa.install()" [disabled]="pwa.installing()"
        [attr.aria-label]="'pwa_install_title' | translate">
        <i class="fa-solid" [ngClass]="pwa.installing() ? 'fa-spinner fa-spin' : 'fa-download'"></i>
        <span>{{ 'pwa_install_button' | translate }}</span>
      </button>

      <button [routerLink]="['/auth/login']" class="btn-header">
        {{ 'LOGIN' | translate }}
      </button>

      <app-translation></app-translation>
    </div>
  </div>
</section>
