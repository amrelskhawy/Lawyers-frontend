<div class="contact-fab-stack" [class.with-chat]="withChat">

  <!-- Call Button -->
  <a [href]="'tel:' + phone" class="contact-fab call-fab" [attr.aria-label]="'CALL_US' | translate"
    [attr.title]="'CALL_US' | translate">
    <i class="fa-solid fa-phone" aria-hidden="true"></i>
  </a>

  <!-- WhatsApp Button -->
  <a [href]="whatsapp" target="_blank" rel="noopener noreferrer" class="contact-fab whatsapp-fab"
    [attr.aria-label]="'WHATSAPP' | translate" [attr.title]="'WHATSAPP' | translate">
    <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
  </a>

</div>
