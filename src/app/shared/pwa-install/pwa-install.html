<!-- Android / desktop Chromium: native install available -->
<div class="pwa-install-banner" *ngIf="pwa.bannerVisible() && pwa.canInstall()" role="dialog" dir="rtl"
  [attr.aria-label]="'pwa_install_title' | translate">
  <span class="pwa-icon"><i class="fa-solid fa-mobile-screen-button"></i></span>
  <div class="pwa-body">
    <span class="pwa-title">{{ 'pwa_install_title' | translate }}</span>
    <span class="pwa-text">{{ 'pwa_install_text' | translate }}</span>
  </div>
  <button type="button" class="pwa-install-btn" (click)="pwa.install()" [disabled]="pwa.installing()">
    <i class="fa-solid" [ngClass]="pwa.installing() ? 'fa-spinner fa-spin' : 'fa-download'"></i>
    {{ 'pwa_install_button' | translate }}
  </button>
  <button type="button" class="pwa-dismiss-btn" (click)="pwa.dismissBanner()"
    [attr.aria-label]="'close' | translate" [disabled]="pwa.installing()">
    <i class="fa-solid fa-xmark"></i>
  </button>
</div>

<!-- iOS / iPadOS Safari: manual add-to-home-screen instructions -->
<div class="pwa-install-banner pwa-ios" *ngIf="pwa.bannerVisible() && pwa.isIosSafari() && !pwa.canInstall()"
  role="dialog" dir="rtl" [attr.aria-label]="'pwa_install_title' | translate">
  <span class="pwa-icon"><i class="fa-solid fa-mobile-screen-button"></i></span>
  <div class="pwa-body">
    <span class="pwa-title">{{ 'pwa_install_title' | translate }}</span>
    <span class="pwa-text pwa-ios-steps">
      {{ 'pwa_install_ios_1' | translate }}
      <i class="fa-solid fa-arrow-up-from-bracket pwa-inline-icon"></i>
      {{ 'pwa_install_ios_2' | translate }}
      <i class="fa-solid fa-square-plus pwa-inline-icon"></i>
      {{ 'pwa_install_ios_3' | translate }}
    </span>
  </div>
  <button type="button" class="pwa-dismiss-btn" (click)="pwa.dismissBanner()"
    [attr.aria-label]="'close' | translate">
    <i class="fa-solid fa-xmark"></i>
  </button>
</div>
