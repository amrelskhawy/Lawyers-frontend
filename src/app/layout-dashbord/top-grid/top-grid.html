<div class="header-grid">
  @if (pages() !== 'Admin' && showAddButton) {
  <button class="btn-add" (click)="visibelform()">
    <i class="fa-solid fa-plus"></i> {{ 'add' | translate }}
  </button>
  }

  <div class="filed-search">
    <input #searchInput (keyup.enter)="onSearch(searchInput.value)" placeholder="{{ 'searchByName' | translate }}" />
    <i class="fa-solid fa-magnifying-glass search-trigger" (click)="onSearch(searchInput.value)"></i>
  </div>

  <div class="account-admin" *ngIf="userData()">
    <div class="user-info">
      <h4>
        {{ userData().name }}
        <i *ngIf="!userData().isDerivedName" class="fa-regular fa-user"></i>
      </h4>
      <p>{{ userData().email }}</p>
    </div>
    <img height="40" width="40" class="account-avatar"
         [src]="userData().picture || '/assets/Img/2a.webp'"
         (error)="onAvatarError($event)" alt="" />
  </div>
</div>
