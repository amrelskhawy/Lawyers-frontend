<ng-template #actions let-item let-onDelete="delete">
  <div class="action-btn">
    <button [pTooltip]="'edit' | translate" tooltipPosition="top"
      (click)="openEdit(item)" class="edit-btn">
      <i class="fa-solid fa-pen-to-square"></i>
    </button>
    <button [attr.aria-label]="'delete' | translate" (click)="onDelete(item)" class="delete-btn">
      <i class="fa-solid fa-trash"></i>
    </button>
  </div>
</ng-template>

<!-- Role cell: role name + accepted-cases badge (lawyers / consultants only) -->
<ng-template #roleCell let-row>
  <div class="role-cell" dir="rtl">
    <span class="role-name">{{ row.roleLabel }}</span>
    @if (row.role === 'LAWYER' || row.role === 'CONSULTANT') {
      <span class="cases-badge clickable" role="button" tabindex="0"
        [pTooltip]="'view_user_cases' | translate" tooltipPosition="top"
        (click)="goToUserCases(row)"
        (keydown.enter)="goToUserCases(row)" (keydown.space)="goToUserCases(row)">
        <i class="fa-solid fa-folder-open"></i>
        <span class="cases-count">{{ row.acceptedCasesCount ?? 0 }}</span>
      </span>
      <!-- Per-degree breakdown (الدرجات) — only non-zero degrees are shown; each filters
           the cases page to this user + that degree -->
      @for (b of row.degreeBadges; track b.key) {
        <span class="degree-count-badge clickable"
          role="button" tabindex="0"
          [style.color]="b.color"
          [style.border-color]="b.color"
          [style.background]="b.color + '1f'"
          [pTooltip]="b.label" tooltipPosition="top"
          (click)="goToUserCases(row, b.key)"
          (keydown.enter)="goToUserCases(row, b.key)" (keydown.space)="goToUserCases(row, b.key)">
          {{ b.count }}
        </span>
      }
    }
  </div>
</ng-template>

<!-- Role filter tabs -->
<div class="role-tabs" dir="rtl">
  <button *ngFor="let r of roleOptions"
    class="role-tab"
    [class.active]="activeRoleFilter() === r.value"
    (click)="setRoleFilter(r.value)">
    {{ r.label }}
  </button>
</div>

<app-dashboard-crud-page
  [endpoint]="endpoint"
  deleteEndpoint="admin/users"
  bulkDeleteEndpoint="admin/users/many"
  [selectable]="true"
  [columns]="columns"
  [columnTemplates]="{ roleLabel: roleCell }"
  [searchFields]="searchFields"
  [dataMapper]="dataMapper"
  [actionsTemplate]="actions"
  [showAddButton]="true"
  (addNew)="openCreate()">

  <app-form-user
    [visible]="visibleForm"
    (visibleChange)="visibleForm = $event"
    [user]="editingUser()"
    (saved)="onSaved()">
  </app-form-user>

</app-dashboard-crud-page>
