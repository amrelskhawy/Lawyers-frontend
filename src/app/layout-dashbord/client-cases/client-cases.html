<!-- Consultant column cell: name + the consultant slot's own status badge -->
<ng-template #consultantCell let-item>
  <div class="assignee-cell">
    <span class="assignee-name">{{ item.assignedConsultantName || '—' }}</span>
    <span *ngIf="item.assignedConsultantName" class="assignment-status-badge"
      [class.badge-pending]="item.consultantAssignmentStatus === 'PENDING'"
      [class.badge-accepted]="item.consultantAssignmentStatus === 'ACCEPTED'"
      [class.badge-rejected]="item.consultantAssignmentStatus === 'REJECTED'"
      [class.badge-unassigned]="item.consultantAssignmentStatus === 'UNASSIGNED' || !item.consultantAssignmentStatus"
      [pTooltip]="('assignment_status_' + (item.consultantAssignmentStatus ?? 'unassigned').toLowerCase()) | translate"
      tooltipPosition="top">
      <i class="fa-solid fa-circle"></i>
    </span>
  </div>
</ng-template>

<!-- Lawyer column cell: name + the lawyer slot's own status badge -->
<ng-template #lawyerCell let-item>
  <div class="assignee-cell">
    <span class="assignee-name">{{ item.assignedLawyerName || '—' }}</span>
    <span *ngIf="item.assignedLawyerName" class="assignment-status-badge"
      [class.badge-pending]="item.assignmentStatus === 'PENDING'"
      [class.badge-accepted]="item.assignmentStatus === 'ACCEPTED'"
      [class.badge-rejected]="item.assignmentStatus === 'REJECTED'"
      [class.badge-unassigned]="item.assignmentStatus === 'UNASSIGNED' || !item.assignmentStatus"
      [pTooltip]="('assignment_status_' + (item.assignmentStatus ?? 'unassigned').toLowerCase()) | translate"
      tooltipPosition="top">
      <i class="fa-solid fa-circle"></i>
    </span>
  </div>
</ng-template>

<ng-template #actions let-item let-onDelete="delete">
  <div class="action-btn">

    <!-- Assignee (lawyer/consultant): accept / reject their OWN pending assignment -->
    <ng-container *ngIf="isLawyer && mySlotStatus(item) === 'PENDING'">
      <button class="accept-btn" [pTooltip]="'accept_assignment' | translate" tooltipPosition="top"
        (click)="acceptAssignment(item, $event)">
        <i class="fa-solid fa-check"></i>
      </button>
      <button class="reject-btn" [pTooltip]="'reject_assignment' | translate" tooltipPosition="top"
        (click)="rejectAssignment(item, $event)">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </ng-container>

    <!-- Staff + assignees with an active (pending/accepted) own slot: edit -->
    <button *ngIf="!isLawyer || mySlotStatus(item) === 'ACCEPTED' || mySlotStatus(item) === 'PENDING'"
      [pTooltip]="'edit' | translate" tooltipPosition="top" [attr.aria-label]="'edit' | translate"
      (click)="onEditCase(item)" class="edit-btn">
      <i class="fa-solid fa-pen-to-square"></i>
    </button>

    <!-- Reports: admin + moderator + assignee (own slot accepted only); hidden for receptionist -->
    <ng-container *ngIf="canViewReports && (!isLawyer || mySlotStatus(item) === 'ACCEPTED')">
      <button [attr.aria-label]="'create_session_report' | translate" [pTooltip]="'create_session_report' | translate"
        tooltipPosition="top" (click)="onCreateSessionReport(item)" class="session-report-btn">
        <i class="fa-solid fa-file-lines"></i>
      </button>
      <button [attr.aria-label]="'field_visit_report' | translate" [pTooltip]="'field_visit_report' | translate"
        tooltipPosition="top" (click)="onCreateFieldVisitReport(item)" class="field-visit-btn">
        <i class="fa-solid fa-location-dot"></i>
      </button>
      <button *ngIf="canManageFeesContract" [attr.aria-label]="'lawyer_fees_contract' | translate"
        [pTooltip]="'lawyer_fees_contract' | translate"
        tooltipPosition="top" (click)="onCreateLawyerFeesContract(item)" class="fees-contract-btn">
        <i class="fa-solid fa-file-signature"></i>
      </button>
      <button [attr.aria-label]="'reminders_title' | translate" [pTooltip]="'reminders_title' | translate"
        tooltipPosition="top" (click)="onManageReminders(item)" class="reminder-btn">
        <i class="fa-solid fa-bell"></i>
      </button>
    </ng-container>

    <a *ngIf="item.customer?.caseReportsFolderId"
      [href]="'https://drive.google.com/drive/folders/' + item.customer.caseReportsFolderId"
      target="_blank" rel="noopener noreferrer"
      [pTooltip]="'drive_folder' | translate" tooltipPosition="top"
      class="drive-btn">
      <i class="fa-brands fa-google-drive"></i>
    </a>

    <button *ngIf="!isLawyer && !isReceptionist" [attr.aria-label]="'delete' | translate" (click)="onDelete(item)" class="delete-btn">
      <i class="fa-solid fa-trash"></i>
    </button>
  </div>
</ng-template>

<app-dashboard-crud-page endpoint="cases" deleteEndpoint="cases" [columns]="columns" [searchFields]="searchFields"
  [actionsTemplate]="actions" [columnTemplates]="columnTemplates" [dataMapper]="dataMapper" [showAddButton]="!isLawyer"
  (addNew)="visibelform.set(true)">

  <app-form-create-case *ngIf="!isLawyer" [(visible)]="visibelform" (created)="onCreated($event)">
  </app-form-create-case>
  <app-reminders-dialog [(visible)]="visibelReminders" [objCase]="selectedCase()"></app-reminders-dialog>
  <app-reject-assignment-dialog [visible]="visibelReject()"
    (visibleChange)="visibelReject.set($event)"
    (confirmReason)="onRejectConfirmed($event)"></app-reject-assignment-dialog>
</app-dashboard-crud-page>
