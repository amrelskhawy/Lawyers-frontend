<section class="wrapper-information-booging">
  <div class="header-information">
    <i class="fa-solid fa-address-book"></i>
    <div>
      <h3>{{ 'PERSONAL_DATA' | translate }}</h3>
      <p>{{ 'PERSONAL_DATA_DESC' | translate }}</p>
    </div>
  </div>
  <form [formGroup]="bookingService.bookingForm()">
    <div class="Group">
      <label>{{ 'email' | translate }} </label>
      <input formControlName="clientEmail" type="email" autocomplete="email" placeholder="{{ 'email' | translate }}" />
      <div class="wrapper-error">
        <small class="error-message" *ngIf="
            getControlName('clientEmail')?.errors?.['required'] &&
            getControlName('clientEmail')?.touched
          ">
          {{ 'filed_reqierd' | translate }}
        </small>
        <small class="error-message" *ngIf="
            getControlName('clientEmail')?.errors?.['email'] &&
            getControlName('clientEmail')?.touched
          ">
          {{ 'vaild_email' | translate }}
        </small>
      </div>
    </div>

    <div class="Group">
      <label> {{ 'name' | translate }}</label>
      <input formControlName="name" autocomplete="name" placeholder="{{ 'name' | translate }}" />
      <div class="wrapper-error">
        <small class="error-message" *ngIf="getControlName('name')?.invalid && getControlName('name')?.touched">{{
          'filed_reqierd' | translate }}</small>
      </div>
    </div>

    <div class="Group">
      <label>{{ 'phone' | translate }}</label>
      <div class="phone-group">
        <select formControlName="phoneCountryCode" class="country-code-select">
          <option value="+20">🇪🇬 +20</option>
          <option value="+966">🇸🇦 +966</option>
          <option value="+971">🇦🇪 +971</option>
          <option value="+965">🇰🇼 +965</option>
          <option value="+974">🇶🇦 +974</option>
          <option value="+973">🇧🇭 +973</option>
          <option value="+968">🇴🇲 +968</option>
          <option value="+962">🇯🇴 +962</option>
          <option value="+961">🇱🇧 +961</option>
          <option value="+963">🇸🇾 +963</option>
          <option value="+964">🇮🇶 +964</option>
          <option value="+212">🇲🇦 +212</option>
          <option value="+216">🇹🇳 +216</option>
          <option value="+213">🇩🇿 +213</option>
          <option value="+218">🇱🇾 +218</option>
          <option value="+249">🇸🇩 +249</option>
          <option value="+1">🇺🇸 +1</option>
          <option value="+44">🇬🇧 +44</option>
          <option value="+33">🇫🇷 +33</option>
          <option value="+49">🇩🇪 +49</option>
          <option value="+90">🇹🇷 +90</option>
        </select>
        <input formControlName="phone_number" placeholder="{{ 'phone' | translate }}" type="tel" inputmode="numeric" />
      </div>
      <div class="wrapper-error">
        <small class="error-message"
          *ngIf="getControlName('phone_number')?.errors?.['required'] && getControlName('phone_number')?.touched">
          {{ 'filed_reqierd' | translate }}
        </small>
        <small class="error-message"
          *ngIf="getControlName('phone_number')?.errors?.['pattern'] && getControlName('phone_number')?.touched">
          {{ 'vaild_phone' | translate }}
        </small>
      </div>
    </div>
    <button (click)="onNextStep()" class="next-btn">{{ 'NEXT_BTN' | translate }}</button>
  </form>
</section>
