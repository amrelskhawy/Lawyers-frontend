<div class="header-payment">
  <span>💳</span>
  <div>
    <h3>{{"payment"|translate}}</h3>
    <p>{{"SUBTITLE"|translate}}</p>
  </div>
</div>

<div class="type-of-payment" dir="rtl">
  <button class="card" [ngClass]="{ active: typepayment() == 'TABBY' }" (click)="OnSelectPayment('TABBY')">
    <div class="check-badge">
      <i *ngIf="typepayment() == 'TABBY'" class="fa-solid fa-circle-check"></i>
    </div>
    <img src="assets/Img/Tabby_Small_Use_this.png" class="provider-img" alt="provider-img" />
    <h3>{{"TABBY_NAME"|translate}}</h3>
    <p>{{"TABBY_DESC"|translate}}</p>
  </button>

  <button [ngClass]="{ active: typepayment() == 'TAMARA' }" class="card" (click)="OnSelectPayment('TAMARA')">
    <div class="check-badge">
      <i *ngIf="typepayment() == 'TAMARA'" class="fa-solid fa-circle-check"></i>
    </div>
    <img src="assets/Img/Tamara_Logo-EN-3000x973.webp" class="provider-img" alt="provider-img" />

    <h3>{{"TAMARA_NAME"|translate}}</h3>
    <p>{{"TABBY_DESC"|translate}}</p>
  </button>

  <button class="card" (click)="OnSelectPayment('PAYMOB')">
    <div class="check-badge">
      <i *ngIf="typepayment() == 'PAYMOB'" class="fa-solid fa-circle-check"></i>
    </div>
    <img src="assets/Img/apple-pay.png" class="provider-img" alt="apple-pay" />
    <h3>{{"APPLY_PAY_NAME"|translate}}</h3>
    <p>{{"APPLY_PAY_DESC"|translate}}</p>
  </button>

  <!-- <button class="card" [ngClass]="{ active: typepayment() == 'STRIPE' }" (click)="OnSelectPayment('STRIPE')">
    <div class="check-badge">
      <i *ngIf="typepayment() == 'STRIPE'" class="fa-solid fa-circle-check"></i>
    </div>
    <img src="assets/Img/OIP.webp" class="provider-img" alt="provider-img" />
    <h3>{{"STRIPE_NAME"|translate}}</h3>
    <p>{{"STRIPE_DESC"|translate}}</p>
  </button> -->
</div>

<button (click)="onNextStep()" class="next-btn">{{ 'NEXT_BTN' | translate }}</button>
