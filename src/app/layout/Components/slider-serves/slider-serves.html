@if (data().length > 0) {
<div [dir]="getcuurentLangauage() === 'ar' ? 'rtl' : 'ltr'">
  <p-carousel [value]="data()" [numVisible]="3" [numScroll]="1" [showIndicators]="false"
    [responsiveOptions]="responsiveOptions">
    <ng-template let-service #item>
      <div (click)="showData(service)"
        (keydown.enter)="showData(service)"
        (keydown.space)="showData(service); $event.preventDefault()"
        role="button" tabindex="0"
        [attr.aria-label]="getcuurentLangauage() == 'ar' ? service.name_ar : service.name_en"
        class="card animation-duration-1000" pAnimateOnScroll enterClass="my-enter-zoom"
        leaveClass="my-leave-animation">
        <div class="card-band">
          <div class="card-icon">
            <i class="fa-solid fa-scale-balanced" aria-hidden="true"></i>
          </div>
          <div class="card-price-badge">
            <span class="price-value">{{ service.price }}</span>
            <span class="price-currency">﷼</span>
          </div>
        </div>

        <div class="card-content">
          <h3 class="card-title">
            {{ getcuurentLangauage() == 'ar' ? service.name_ar : service.name_en }}
          </h3>
          <p class="card-desc">
            {{ getServiceDescription(service) }}
          </p>

          <span class="read-more-wrapper">
            <span class="read-more">{{ 'read_more' | translate }}</span>
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
          </span>

          <button type="button" class="book-now-btn" (click)="bookService($event, service)">
            <i class="fa-solid fa-check" aria-hidden="true"></i>
            {{ 'book_now' | translate }}
          </button>
        </div>
      </div>
    </ng-template>
  </p-carousel>
</div>
} @else {
<div class="empty-state">
  <h2>{{ 'SERVICES_UPDATING_TITLE' | translate }}</h2>
  <p>{{ 'SERVICES_UPDATING_DESC' | translate }}</p>
</div>
}

<app-deatails-descrption [objData]="objData()" [(visible)]="visibelData"></app-deatails-descrption>
